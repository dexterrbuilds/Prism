services:
  - type: web
    name: prism-signal-engine
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DRY_RUN
        value: "false"
      - key: SCAN_INTERVAL_SECONDS
        value: "2700"
      - key: EXCHANGE
        value: binance
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_CHAT_IDS
        sync: false
      - key: TELEGRAM_CHANNEL_IDS
        sync: false
